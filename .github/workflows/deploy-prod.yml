name: Prod deployment env

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  prod-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install libvirt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            libvirt-daemon \
            pkg-config
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test ./... -v

  prod-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: prod-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/lambda-server:prod

  prod-deploy:
    needs: prod-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Prod via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker network create --attachable --driver overlay aws-prod-network  || true
            docker pull qarani/lambda-server:prod
            docker stop lambda-server-prod || true
            docker service rm lambda-server-prod || true

            docker service create \
              --name lambda-server-prod \
              --network aws-prod-network \
              --publish published=8089,target=8089 \
              --env APP_PROFILE=prod \
              --env DB_HOST=postgres-prod \
              --env DB_PORT=5432 \
              --env DB_USER=postgres-prod-user \
              --env DB_PASSWORD=postgres-prod-password \
              --env DB_NAME=lambda_db \
              --env DB_SSLMODE=disable \
              --env NATS_URL=nats://nats-prod:4222 \
              --env NATS_USER=nats-prod-user \
              --env NATS_PASSWORD=nats-prod-password \
              --env INSTANCE_TOKEN_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 \
              --env HTTP_PORT=8089 \
              --env EUREKA_SERVER_URL=http://discovery-server-prod:8761/eureka \
              --env EUREKA_APP_NAME=LAMBDA-SERVER \
              --env EUREKA_HOSTNAME=lambda-server-prod \
              --env EUREKA_IP_ADDR=lambda-server-prod \
              --env EUREKA_VIP_ADDRESS=lambda-server \
              --env EUREKA_INSTANCE_ID=lambda-server:8089 \
              --env EUREKA_HEARTBEAT_INTERVAL=30s \
              qarani/lambda-server:prod




